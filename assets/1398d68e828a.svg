<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- иконка когтеточки для карточки магазина: компактная (квадратная), вид
     спереди-сверху, отдельно от «сценовой» scratch-post.svg (та высокая и узкая,
     ставится на пол у аптеки) -->
  <ellipse cx="60" cy="106" rx="40" ry="9" fill="rgba(39,56,74,0.10)"/>
  <!-- основание -->
  <ellipse cx="60" cy="98" rx="38" ry="12" fill="#dbe7f0" stroke="#27384a" stroke-width="3"/>
  <ellipse cx="60" cy="95" rx="30" ry="9" fill="#eaf3fb"/>
  <!-- столбик с канатной обмоткой -->
  <rect x="42" y="26" width="36" height="72" rx="14" fill="#e8d9b8" stroke="#27384a" stroke-width="3"/>
  <g stroke="#c9b485" stroke-width="3" stroke-linecap="round">
    <line x1="44" y1="36" x2="76" y2="44"/>
    <line x1="44" y1="52" x2="76" y2="60"/>
    <line x1="44" y1="68" x2="76" y2="76"/>
    <line x1="44" y1="84" x2="76" y2="92"/>
  </g>
  <!-- когтевые царапины поверх — узнаваемый мотив -->
  <g stroke="#a5720a" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <line x1="50" y1="20" x2="44" y2="40"/>
    <line x1="58" y1="18" x2="53" y2="40"/>
    <line x1="66" y1="18" x2="63" y2="40"/>
  </g>
</svg>
